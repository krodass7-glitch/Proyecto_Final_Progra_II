<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reportes')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <div th:replace="~{fragments :: mensajes}"></div>
    <h1>Reportes</h1>
    <div class="cuadricula">
        <section class="tarjeta">
            <h2>Órdenes por estado</h2>
            <form th:action="@{/reportes/estados}" method="get" class="formulario">
                <label>Estado
                    <select name="estado">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.etiqueta}"></option>
                    </select>
                </label>
                <button class="btn" name="formato" value="html">Ver</button>
                <button class="btn sec" name="formato" value="pdf">PDF</button>
            </form>
        </section>
        <section class="tarjeta">
            <h2>Historial de reparaciones por vehículo</h2>
            <form th:action="@{/reportes/vehiculo}" method="get" class="formulario">
                <label>Placa
                    <select name="placa" required>
                        <option value="" disabled selected>Seleccione una placa</option>
                        <option th:each="v : ${vehiculos}" th:value="${v.placa}" th:text="${v.placa + ' - ' + v.descripcion()}"></option>
                    </select>
                </label>
                <button class="btn" name="formato" value="html">Ver</button>
                <button class="btn sec" name="formato" value="pdf">PDF</button>
            </form>
        </section>
        <section class="tarjeta">
            <h2>Repuestos con existencia de 5 o menos</h2>
            <form th:action="@{/reportes/repuestos}" method="get" class="formulario">
                <button class="btn" name="formato" value="html">Ver</button>
                <button class="btn sec" name="formato" value="pdf">PDF</button>
            </form>
        </section>
        <section class="tarjeta">
            <h2>Órdenes por mecánico y estado</h2>
            <form th:action="@{/reportes/mecanicos}" method="get" class="formulario">
                <label>Mecánico
                    <select name="mecanicoId">
                        <option value="">Todos</option>
                        <option th:each="m : ${mecanicos}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </label>
                <button class="btn" name="formato" value="html">Ver</button>
                <button class="btn sec" name="formato" value="pdf">PDF</button>
            </form>
        </section>
        <section class="tarjeta">
            <h2>Ingresos por reparaciones</h2>
            <form th:action="@{/reportes/ingresos}" method="get" class="formulario">
                <label>Desde
                    <input type="date" name="desde" required>
                </label>
                <label>Hasta
                    <input type="date" name="hasta" required>
                </label>
                <button class="btn" name="formato" value="html">Ver</button>
                <button class="btn sec" name="formato" value="pdf">PDF</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
